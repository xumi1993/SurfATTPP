
#######################################
# data parameters
#######################################
data:
  # Rayleigh-wave source-receiver files
  src_rec_file_rl_ph: src_rec_file_rotated.csv
  wave_type: [True, False] # [use_rayleigh, use_love]
  vel_type:  [True, False] # [use_phase, use_group]
  weights:   [0.5, 0.5]    # weights for phase and group velocity

output:
  output_path: OUTPUT_FILES/ # path to save output files
  output_initial_model: True # whether output initial model
  output_in_process_data: True
  output_in_process_model: True
  log_level: 2 # 1 debug mode, 2: info mode, 3: warning mode, 4: error mode

domain:
  depth_min_max: [0, 15] # depth range in km
  grid_method: 0 # 0: grid by interval; 1: grid by min max and number of grid
  grid_method_0:
    interval: [0.01, 0.01, 0.5] # interval of lon(degree), lat(degree), z(km)
    num_grid_margin: 5 # number of grid margin

model:
  # ------- Initial model --------
  init_model_type: 1 # 0: increase from v0 to v1; 1: 1D inversion for average tt; 2: use a 3D vs model
  vel_range: [1.8, 4.2]
  init_model_path: /path/to/init_mod.h5 # Path to initial model. Only valid in init_model_type: 2

topo:
  is_consider_topo: True # whether consider topography
  topo_file: hawaii_rotated.nc # Path to local elevation file. Only valid in topo_type: 1 and 2
  wavelen_factor: 2.5

postproc:
  kdensity_coe: 1  # Kdensity_coe is used to rescale the final kernel:  kernel -> kernel / pow(density of kernel, Kdensity_coe).
  independent_smooth_ani: False # if True, smooth azimuthal anisotropy (Gc/Gs) kernels with sigma_ani / n_inv_grid_ani
  smooth_method: 1 # 0: PDE (Gaussian) smoothing; 1: multigrid smoothing
  smooth_method_0:
    sigma: [0.1, 2] # smoothing lengths [horizontal (degree), vertical (km)]
    sigma_ani: [0.1, 2] # same units as sigma; azimuthal anisotropy (Gc/Gs) kernels only, ignored for radial anisotropy (gamma uses sigma)
  smooth_method_1:
    n_inv_components: 5
    n_inv_grid: [8, 9, 10]
    n_inv_grid_ani: [8, 9, 10] # azimuthal anisotropy (Gc/Gs) kernels only, ignored for radial anisotropy
    # Optional irregular inversion grids, one per axis (naming follows TomoATT).
    # Each is the full node list for that axis: the first and last entries are the
    # boundary nodes (held fixed) and the ones between them are staggered across the
    # n_inv_components sets. The list must be strictly increasing and must bracket
    # the model domain. Units: degrees for lon/lat (in the rotated frame if the run
    # is rotated), km depth for dep.
    # Any axis left out keeps the uniform grid built from n_inv_grid, so giving only
    # dep_inv refines depth while lon/lat stay uniform. The *_ani versions need
    # independent_smooth_ani: true.
    # dep_inv:     [-0.5, 1.0, 3.0, 6.0, 12.0, 25.5]
    # dep_inv_ani: [-0.5, 1.0, 3.0, 6.0, 12.0, 25.5]

inversion:
  # ------- Inversion parameters --------
  model_para_type: 0 # 0 Isotropic, 1 Azimuthal anisotropy, 2 Radial anisotropy
  use_alpha_beta_rho: true
  rho_scaling: true
  # ------- Inversion parameters --------
  niter: 40 # max iterations
  min_derr: 0.0001 # minimum error change
  # ------- optimization parameters -------
  optim_method: 1 # 0: SD (adeptive step length); 1: LBFGS (line search)
  step_length: 0.02 # starting step length
  maxshrink: 0.6 # max step length descent
  # ------- Line search for LBFGS -------
  c1: 0.1
  c2: 0.9
  max_sub_niter: 10 # max sub iterations for line search
